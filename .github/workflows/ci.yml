name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check content.js
        run: node --check content.js

      - name: Validate manifest.json
        run: |
          node -e "
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const errors = [];
          if (m.manifest_version !== 3) errors.push('manifest_version must be 3, got ' + m.manifest_version);
          if (!m.name) errors.push('missing name');
          if (!m.version) errors.push('missing version');
          if (!Array.isArray(m.content_scripts) || m.content_scripts.length === 0) errors.push('missing content_scripts');
          for (const cs of m.content_scripts) {
            if (!Array.isArray(cs.matches) || cs.matches.length === 0) errors.push('content_script missing matches');
            if (!Array.isArray(cs.js) || cs.js.length === 0) errors.push('content_script missing js');
            if (cs.world && cs.world !== 'MAIN' && cs.world !== 'ISOLATED') errors.push('invalid world: ' + cs.world);
          }
          if (errors.length) { console.error('Manifest errors:'); errors.forEach(e => console.error(' - ' + e)); process.exit(1); }
          console.log('manifest.json valid ✓');
          "

      - name: Check referenced files exist
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const missing = [];
          const check = (p) => { if (!fs.existsSync(p)) missing.push(p); };
          // content scripts
          for (const cs of m.content_scripts || []) for (const j of cs.js || []) check(j);
          // action icon(s)
          if (m.action) {
            if (typeof m.action.default_icon === 'string') check(m.action.default_icon);
            else if (m.action.default_icon) for (const k of Object.keys(m.action.default_icon)) check(m.action.default_icon[k]);
          }
          // top-level icons
          if (m.icons) for (const k of Object.keys(m.icons)) check(m.icons[k]);
          // web_accessible_resources
          for (const war of m.web_accessible_resources || []) for (const r of war.resources || []) {
            // allow globs (only check if no wildcard)
            if (!r.includes('*')) check(r);
          }
          if (missing.length) { console.error('Missing files referenced in manifest:'); missing.forEach(p => console.error(' - ' + p)); process.exit(1); }
          console.log('All manifest-referenced files present ✓');
          "

      - name: Lint content.js (no parse errors via Function constructor)
        run: |
          node -e "
          const fs = require('fs');
          const src = fs.readFileSync('content.js','utf8');
          // Wrap in a function to verify it parses as a body (node --check already did, this is belt-and-braces)
          try { new Function(src); console.log('content.js parses as function body ✓'); }
          catch (e) { console.error('content.js parse error:', e.message); process.exit(1); }
          // Sanity: ensure the IIFE guard and core hooks exist
          const required = ['XMLHttpRequest.prototype', 'WebSocket.prototype', "'/game'", 'foe-side-tracker'];
          const absent = required.filter(s => !src.includes(s));
          if (absent.length) { console.error('content.js missing expected tokens:', absent); process.exit(1); }
          console.log('content.js contains expected hooks ✓');
          "
